name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n monad-failover.sh

      - name: ShellCheck (style level)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S style monad-failover.sh tests/mocks/*

      - name: README checksum matches script
        run: |
          want="$(grep -oE '\b[0-9a-f]{64}\b' README.md | head -1)"
          got="$(sha256sum monad-failover.sh | awk '{print $1}')"
          echo "README: $want"
          echo "script: $got"
          test "$want" = "$got"

      - name: README install URL pins the current version
        run: |
          ver="$(grep -m1 '^VERSION=' monad-failover.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "script version: $ver"
          grep -q "monad-failover-tool/v${ver}/monad-failover.sh" README.md

      - name: Flags smoke test
        run: |
          bash monad-failover.sh --version
          bash monad-failover.sh --help
          bash monad-failover.sh --dry-run && exit 1 || test $? -eq 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: End-to-end tests (mocked Monad binaries)
        run: bats tests
