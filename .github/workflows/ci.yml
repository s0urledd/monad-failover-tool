name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags reboottest ./internal/promote

      - name: ShellCheck (test mocks)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S style tests/mocks/*

      - name: Reproducible release build (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w -buildid=' -o monad-failover ./cmd/monad-failover

      - name: README checksum matches the release build
        run: |
          want="$(grep -oE '\b[0-9a-f]{64}\b' README.md | head -1)"
          got="$(sha256sum monad-failover | awk '{print $1}')"
          echo "README: $want"
          echo "build:  $got"
          test "$want" = "$got"

      - name: README install URL pins the current version
        run: |
          ver="$(grep -m1 '^const Version' cmd/monad-failover/main.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?')"
          echo "version: $ver"
          grep -q "releases/download/v${ver}/monad-failover" README.md
          grep -q "git checkout v${ver}" README.md

      - name: Flags smoke test
        run: |
          ./monad-failover --version
          ./monad-failover --help
          ./monad-failover --dry-run && exit 1 || test $? -eq 1

      # The flow tests drive the real migration in-process against the mock
      # Monad binaries in tests/mocks; no root, network or systemd needed.
      - name: go test
        run: go test ./...
